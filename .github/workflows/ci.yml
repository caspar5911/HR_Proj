# Continuous integration gate for every push to main and every pull request.
#
#   backend  — full API test suite (in-memory SQLite; no database service
#              needed) against Python 3.12, the same major version the
#              container image is built from
#   frontend — unit tests + production build (which type-checks)
#
# A push is only safe to merge/deploy when both jobs pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arella-hr/backend
    env:
      # The settings layer refuses to boot without a real JWT signing key
      # (fail-fast, see app/config.py). tests/conftest.py also supplies a
      # test-only key via os.environ.setdefault; exporting it here documents
      # the requirement and makes the gate independent of that fallback.
      SECRET_KEY: ci-test-secret-key-not-for-production-0000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arella-hr/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arella-hr/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arella-hr/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (type-checks + bundles)
        run: npm run build
