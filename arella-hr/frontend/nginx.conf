server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defensive security headers for the SPA documents this server itself
    # serves (index.html + hashed assets). These mirror the backend's
    # SecurityHeadersMiddleware so the browser gets a consistent policy on
    # the main document and the API responses alike:
    #   - nosniff: stop MIME-type re-interpretation
    #   - X-Frame-Options: DENY + frame-ancestors 'none': the app must never
    #     be embedded in a frame (clickjacking defence); the CSP form is the
    #     modern successor, both are sent for older and newer browsers
    #   - Referrer-Policy: don't leak the full request URL to other origins
    # A full content-restricting CSP (script-src, etc.) is intentionally NOT
    # set here: the SPA's asset graph is build-generated, and a too-strict
    # policy would silently break it. Frame/MIME/referrer hardening is safe.

    # Immutable hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # API requests are proxied to the backend service — the browser sees a
    # single origin, so no CORS configuration is needed on the client.
    # NOTE: the backend already attaches the same security headers to its
    # responses, so they are intentionally NOT repeated here (avoid dupes).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
